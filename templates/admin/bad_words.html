{% extends 'admin/master.html' %}

{% block body %}
{{ base_css|safe }}
<main class="admin-shell">
  <section class="hero">
    <span class="badge-soft">فیلتر محتوا</span>
    <h1>کلمات ممنوعه</h1>
    <p>هر کلمه یا عبارت این لیست اگر در پیام کاربر عادی دیده شود، پیام حذف می‌شود.</p>
  </section>

  <section class="panel-card">
    <form class="admin-form" method="post">
      <label for="word">افزودن کلمه یا عبارت</label>
      <div class="actions">
        <input id="word" name="word" placeholder="مثلاً یک عبارت ممنوعه" required style="flex: 1 1 280px;">
        <button class="pretty-btn" type="submit">افزودن</button>
      </div>
    </form>
  </section>

  <section class="word-list">
    {% for item in words %}
      <article class="word-row">
        <span class="word">{{ item.word }}</span>
        <form method="post" action="{{ url_for('bad_words.delete', word_id=item.id) }}">
          <button class="danger-btn" type="submit">حذف</button>
        </form>
      </article>
    {% else %}
      <article class="panel-card">
        <p class="muted">هنوز هیچ کلمه‌ای ثبت نشده است.</p>
      </article>
    {% endfor %}
  </section>
</main>
{% endblock %}
